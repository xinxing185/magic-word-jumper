
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magic Word Jumper</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Fredoka:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
  <style>
    body {
      font-family: 'Fredoka', sans-serif;
      background-color: #a5f3fc;
      overflow: hidden;
    }
    #root,
    #root * {
      font-weight: 400 !important;
    }
    .pixel-font {
      font-family: 'Press+Start+2P', cursive;
    }
    .pixel-border {
      box-shadow: 
        0 -4px 0 0 #000,
        0 4px 0 0 #000,
        -4px 0 0 0 #000,
        4px 0 0 0 #000;
    }
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
    .animate-pixel-bounce {
      animation: bounce 1s infinite;
    }
    .level-card {
      transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .level-card:hover {
      transform: scale(1.05) translateY(-5px);
    }
    @keyframes menu-rise {
      0% {
        opacity: 0;
        transform: translateY(22px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    @keyframes menu-pop {
      0% {
        opacity: 0;
      }
      100% {
        opacity: 1;
      }
    }
    @keyframes menu-float {
      0%, 100% {
        transform: translate3d(0, 0, 0);
      }
      50% {
        transform: translate3d(0, -12px, 0);
      }
    }
    .menu-hero-copy {
      animation: menu-rise 640ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    .menu-level-board {
      animation: menu-rise 720ms 90ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    .menu-level-button {
      opacity: 0;
      animation: menu-pop 560ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    .menu-voice-bar {
      animation: menu-rise 760ms 160ms cubic-bezier(0.2, 0.8, 0.2, 1) both;
    }
    .menu-float-slow {
      animation: menu-float 7s ease-in-out infinite;
    }
    .menu-float-medium {
      animation: menu-float 5.8s ease-in-out infinite;
    }
    .menu-float-fast {
      animation: menu-float 4.8s ease-in-out infinite;
    }
    .menu-word-tile {
      border-radius: 8px;
      box-shadow:
        0 3px 0 0 rgba(15, 23, 42, 0.18),
        0 14px 28px rgba(15, 23, 42, 0.15);
    }
    @keyframes word-card-enter {
      0% {
        opacity: 0;
        transform: translateY(18px) scale(0.94);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .word-card-enter {
      opacity: 0;
      animation: word-card-enter 720ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }
    @keyframes confetti-fall {
      0% {
        opacity: 0;
        transform: translateY(-18px) scale(0.7) rotate(0deg);
      }
      18% {
        opacity: 1;
      }
      100% {
        opacity: 0;
        transform: translateY(150px) scale(1) rotate(280deg);
      }
    }
    .confetti-piece {
      position: absolute;
      top: 10px;
      width: 10px;
      height: 16px;
      border-radius: 3px;
      animation: confetti-fall 1500ms cubic-bezier(0.18, 0.82, 0.28, 1) forwards;
    }
    @media (prefers-reduced-motion: reduce) {
      .menu-hero-copy,
      .menu-level-board,
      .menu-level-button,
      .menu-voice-bar,
      .menu-float-slow,
      .menu-float-medium,
      .menu-float-fast,
      .word-card-enter,
      .confetti-piece {
        animation: none !important;
        opacity: 1 !important;
      }
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3"
  }
}
</script>
</head>
<body>
  <div id="root"></div>
<script type="module" src="/index.tsx"></script>
</body>
</html>
